# Minimal demonstration of nanopub-hugo.
#
# Three sections, one per way of declaring where the content comes from:
#
#   publications  a query nanopub, fetched at build time      (query + static)
#   news          a view nanopub, which names its own query   (view  + static)
#   recent        queried in the visitor's browser            (live)
#
# No personal data: every query and view here is public, and the only parameter
# passed is a public space, so this site builds for anyone, anywhere.

baseURL = 'https://example.org/'
title = 'nanopub-hugo'
themesDir = '../..'
theme = 'nanopub-hugo'

disableKinds = ['rss', 'sitemap']

# ---------------------------------------------------------------------------
# REQUIRED. resources.GetRemote refuses any media type not on this allowlist,
# and Hugo does not let a module contribute it. Do not anchor with $: responses
# carry a ";charset=UTF-8" suffix.
# ---------------------------------------------------------------------------
[security.http]
mediaTypes = ['^application/ld\+json', '^application/sparql-results\+json']

# Declare any taxonomy a section maps to, or Hugo ignores the terms.
[taxonomies]
journal = 'journals'

[params]
description = 'A Hugo site whose content comes from the nanopublication network.'

[params.nanopub]
endpoint = 'https://query.nanodash.net/'
nanodash = 'https://nanodash.net/'
verbose = true

# ---------------------------------------------------------------------------
# 1. A query, named directly — plus a taxonomy. Every paper becomes a page;
#    every journal becomes a term page, generated by Hugo from journal_label.
# ---------------------------------------------------------------------------
[[params.nanopub.sections]]
id = 'publications'
title = 'Publications'
blurb = 'Papers registered in the nanopublication network.'
weight = 1
limit = 10
query = 'https://w3id.org/np/RAp6qnaNFq9rQWNCSqrMf6rATWAwcd-Wfvg9rrLsOTGnk'
[params.nanopub.sections.fields]
title = 'paper_label'
date = 'publication_date'
link = 'paper'
summary = 'authors_label_multi'
[params.nanopub.sections.taxonomies]
journals = 'journal_label'

# ---------------------------------------------------------------------------
# 2. A view instead of a query. The view already records which query answers it
#    (get-news-content) and which of that query's parameters carries the
#    subject ("resource"), so there is no queryParams block here at all —
#    `target` supplies the subject and the view supplies its name.
#
#    contentPlain strips the markup in `body` and keeps the words. Without it
#    this section would need the [security] allowContent opt-in, which is a
#    trust decision about an open network that an example site should not make
#    on a reader's behalf.
# ---------------------------------------------------------------------------
[[params.nanopub.sections]]
id = 'news'
title = 'News'
blurb = 'News items published by the Knowledge Pixels space — via a view nanopublication.'
empty = 'No news yet.'
weight = 2
limit = 10
view = 'https://w3id.org/np/RA2M6734Kz_C3LO07RYZLjVvvnX1nvYECgPCx7f7xr1WU/news-list-view'
target = 'https://w3id.org/spaces/knowledgepixels'
contentPlain = true
[params.nanopub.sections.fields]
title = 'headline'
date = 'datePublished'
link = 'link'
content = 'body'

# ---------------------------------------------------------------------------
# 3. A live section: no pages are built for it. <nanopub-list> queries the
#    network in the visitor's browser, so it is current without a rebuild.
# ---------------------------------------------------------------------------
[[params.nanopub.sections]]
id = 'recent'
title = 'Recent'
blurb = 'The latest nanopublications on the network — queried live, in your browser.'
weight = 3
mode = 'live'
limit = 20
query = 'https://w3id.org/np/RAYNg6rfvXIVvJY2u8oS0EEjxnVvimLLVZG1rOar_nWIY'
[params.nanopub.sections.fields]
title = 'label'
date = 'date'
